services:
  api:
    build: api/
    ports:
      - "8000:80"

  frontend:
    build: frontend/
    ports:
      - "5500:80"
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:  
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: boosterhub
      MYSQL_USER: boosterhub
      MYSQL_PASSWORD: boosterhub
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 5s
      retries: 10
    